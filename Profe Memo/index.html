<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Rosanno | Cantante Oficial</title>
    <!-- Tailwind CSS para estilos modernos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para los iconos elegantes de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuentes Google Fonts: Playfair Display para elegancia y Montserrat para lectura limpia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            light: '#F9E596',
                            DEFAULT: '#D4AF37',
                            dark: '#996515',
                        },
                        obsidian: '#0A0A0C',
                        charcoal: '#141417',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-10 selection:bg-gold selection:text-obsidian relative overflow-x-hidden">

    <!-- Efectos de iluminación ambiental dorada en el fondo -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-gold/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-gold-dark/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Contenedor Principal tipo Banner Elegante -->
    <main class="w-full max-w-4xl bg-gradient-to-br from-charcoal via-obsidian to-charcoal border border-gold/40 rounded-3xl shadow-[0_20px_50px_rgba(212,175,55,0.15)] p-6 sm:p-10 md:p-12 relative z-10 overflow-hidden">
        
        <!-- Líneas decorativas en las esquinas -->
        <div class="absolute top-0 left-0 w-24 h-24 border-t-2 border-l-2 border-gold/50 rounded-tl-3xl pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-24 h-24 border-b-2 border-r-2 border-gold/50 rounded-br-3xl pointer-events-none"></div>

        <!-- Sección Superior: Nombre a la izquierda/centro e Imagen arriba a la derecha -->
        <header class="flex flex-col-reverse sm:flex-row items-center sm:items-start justify-between gap-6 sm:gap-8 pb-8 border-b border-gold/25">
            
            <!-- Lado Izquierdo: Título y Nombre del Artista -->
            <div class="text-center sm:text-left flex-1 pt-2 sm:pt-4">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold/10 border border-gold/30 text-gold text-xs uppercase tracking-widest font-medium mb-4">
                    <i class="fa-solid fa-music text-[10px]"></i>
                    <span>Artista &amp; Intérprete</span>
                </div>
                
                <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight bg-gradient-to-r from-gold-light via-gold to-gold-dark bg-clip-text text-transparent pb-2">
                    Memo Rosanno
                </h1>
                
                <!-- Línea acento dorada -->
                <div class="h-1 w-24 bg-gradient-to-r from-gold to-transparent mx-auto sm:mx-0 rounded-full mt-2"></div>
            </div>

            <!-- Lado Derecho Arriba: Fotografía del Cantante -->
            <div class="relative group shrink-0">
                <!-- Halo dorado brillante detrás de la foto -->
                <div class="absolute -inset-1.5 bg-gradient-to-tr from-gold-dark via-gold-light to-gold rounded-2xl blur opacity-50 group-hover:opacity-80 transition duration-500"></div>
                
                <div class="relative w-36 h-36 sm:w-44 sm:h-44 md:w-48 md:h-48 rounded-2xl overflow-hidden border-2 border-gold bg-obsidian shadow-2xl">
                    <!-- Imagen de muestra (puedes reemplazar el src con la foto real de Memo Rosanno) -->
                    <img 
                        src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=600&q=80" 
                        alt="Memo Rosanno Cantante" 
                        onerror="this.onerror=null; this.src='https://placehold.co/400x400/141417/D4AF37?text=Memo+Rosanno';"
                        class="w-full h-full object-cover object-center transform group-hover:scale-105 transition duration-500"
                    >
                </div>
            </div>
        </header>

        <!-- Sección Central: Descripción Personal -->
        <section class="py-8 text-center sm:text-left">
            <blockquote class="relative">
                <i class="fa-solid fa-quote-left text-gold/20 text-4xl absolute -top-3 -left-2 hidden sm:block"></i>
                <p class="text-gray-300 text-base sm:text-lg md:text-xl leading-relaxed font-light sm:pl-8">
                    "Hola, soy <span class="text-gold font-medium">Memo Rosanno</span>, soy cantante y me gustaría que te echaras una vuelta por mis redes sociales para ver mi carrera."
                </p>
            </blockquote>
        </section>

        <!-- Sección Inferior: Mis Redes Sociales -->
        <footer class="pt-4">
            <div class="flex items-center justify-center sm:justify-start gap-3 mb-6">
                <span class="h-px w-8 bg-gold/50"></span>
                <h2 class="font-serif text-xl sm:text-2xl text-gold-light tracking-wide uppercase">
                    Mis Redes Sociales
                </h2>
                <span class="h-px flex-1 bg-gradient-to-r from-gold/50 to-transparent"></span>
            </div>

            <!-- Cuadrícula de Botones de Redes Sociales -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                
                <!-- Enlace WhatsApp -->
                <a href="https://wa.me/5210000000000?text=Hola%20Memo%20Rosanno,%20vi%20tu%20banner%20musical" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   onclick="mostrarNotificacion('Abriendo WhatsApp de Memo Rosanno...')"
                   class="group flex items-center justify-between p-4 rounded-2xl bg-obsidian/90 border border-gold/30 hover:border-gold hover:bg-gold/10 transition-all duration-300 shadow-lg hover:shadow-gold/20 hover:-translate-y-1">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-gold/20 to-gold-dark/20 border border-gold/40 flex items-center justify-center text-gold group-hover:bg-gold group-hover:text-obsidian transition-colors duration-300">
                            <i class="fa-brands fa-whatsapp text-xl"></i>
                        </div>
                        <div>
                            <span class="block font-semibold text-white group-hover:text-gold-light transition-colors">WhatsApp</span>
                            <span class="block text-xs text-gray-400">Contacto directo</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gold/60 group-hover:text-gold group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                </a>

                <!-- Enlace Facebook -->
                <a href="https://www.facebook.com/" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   onclick="mostrarNotificacion('Abriendo Facebook oficial...')"
                   class="group flex items-center justify-between p-4 rounded-2xl bg-obsidian/90 border border-gold/30 hover:border-gold hover:bg-gold/10 transition-all duration-300 shadow-lg hover:shadow-gold/20 hover:-translate-y-1">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-gold/20 to-gold-dark/20 border border-gold/40 flex items-center justify-center text-gold group-hover:bg-gold group-hover:text-obsidian transition-colors duration-300">
                            <i class="fa-brands fa-facebook-f text-xl"></i>
                        </div>
                        <div>
                            <span class="block font-semibold text-white group-hover:text-gold-light transition-colors">Facebook</span>
                            <span class="block text-xs text-gray-400">Página oficial</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gold/60 group-hover:text-gold group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                </a>

                <!-- Enlace Instagram -->
                <a href="https://www.instagram.com/" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   onclick="mostrarNotificacion('Abriendo Instagram oficial...')"
                   class="group flex items-center justify-between p-4 rounded-2xl bg-obsidian/90 border border-gold/30 hover:border-gold hover:bg-gold/10 transition-all duration-300 shadow-lg hover:shadow-gold/20 hover:-translate-y-1">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-gold/20 to-gold-dark/20 border border-gold/40 flex items-center justify-center text-gold group-hover:bg-gold group-hover:text-obsidian transition-colors duration-300">
                            <i class="fa-brands fa-instagram text-xl"></i>
                        </div>
                        <div>
                            <span class="block font-semibold text-white group-hover:text-gold-light transition-colors">Instagram</span>
                            <span class="block text-xs text-gray-400">Fotos y música</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gold/60 group-hover:text-gold group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                </a>

            </div>
        </footer>
    </main>

    <!-- Notificación flotante elegante (reemplaza cualquier alert) -->
    <div id="toast" class="fixed bottom-6 right-6 bg-charcoal border border-gold text-gold-light px-5 py-3 rounded-2xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 flex items-center gap-3 z-50 pointer-events-none">
        <i class="fa-solid fa-compact-disc fa-spin text-gold"></i>
        <span id="toast-message" class="text-sm font-medium">Redirigiendo...</span>
    </div>

    <script>
        // Función para mostrar un aviso visual sutil al hacer clic en los enlaces
        function mostrarNotificacion(mensaje) {
            try {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                
                toastMessage.textContent = mensaje;
                toast.classList.remove('translate-y-24', 'opacity-0');
                
                setTimeout(() => {
                    toast.classList.add('translate-y-24', 'opacity-0');
                }, 3000);
            } catch (error) {
                console.error('Error al mostrar notificación:', error);
            }
        }
    </script>
</body>
</html>
